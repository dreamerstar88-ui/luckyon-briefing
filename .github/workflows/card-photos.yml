name: Card Background Photos

# 평일 카드(am·pm)의 배경 사진을 그날 내용에 맞게 만들어 main 에 커밋해 둔다.
#
# 왜 워크플로인가
#   사진 생성에는 GEMINI_API_KEY 가 필요한데, 이 키는 **저장소 시크릿**에 있고
#   브리핑 세션의 실행 환경에는 없다. 러너에서 만들어 커밋해 두면 세션은
#   키 없이 `git checkout origin/main -- data/card-photos` 로 받아 쓸 수 있다.
#   (data/krx-flows.json · data/futures-cache.json 과 같은 패턴)
#
# 세션이 부르는 법 (세션에는 gh CLI 가 없다 — GitHub MCP 도구로 부른다)
#   mcp__github__actions_run_trigger: method=run_workflow, workflow_id=card-photos.yml,
#     ref=main, inputs={date, session, prompts:'{"1":"...","3":"..."}'}
#   mcp__github__actions_list: method=list_workflow_runs 로 완료 대기
#   끝나면:
#     git fetch origin main -q && git checkout origin/main -- data/card-photos
#   자세한 절차는 ROUTINE_PROMPT.md 의 배경 사진 항목이 정본이다.
#
# 실패해도 브리핑을 멈추지 않는다. 못 만든 장은 저장소에 든 예비 사진으로 내려간다.

on:
  workflow_dispatch:
    inputs:
      date:
        description: '회차 날짜 (YYYY-MM-DD)'
        required: true
      session:
        description: '세션 (am 또는 pm)'
        required: true
        default: 'am'
      prompts:
        description: '카드 번호 → 장면 설명 JSON. 예 {"1":"...","3":"..."}'
        required: true

permissions:
  contents: write

concurrency:
  group: card-photos-${{ github.event.inputs.date }}-${{ github.event.inputs.session }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 안전장치. 사진 열 장이면 넉넉히 5분이면 끝난다. 그보다 오래 걸리면 무언가
    # 매달린 것이므로 기본 6시간을 기다리지 않고 끊는다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # gen-card-photos.mjs 가 playwright 로 생성본을 줄인다(shrink()). 이 러너는
      # 매번 새로 뜨는 VM 이라 node_modules 가 없고, 이 단계 없이 돌리면
      # "Cannot find package 'playwright'" 로 즉시 실패한다 (2026-08-23 실측 —
      # probe-krx-browser.yml 이 쓰는 것과 같은 설치 패턴).
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARD_PHOTOS: ${{ github.event.inputs.prompts }}
        run: |
          node scripts/gen-card-photos.mjs \
            "${{ github.event.inputs.date }}" "${{ github.event.inputs.session }}"

      # 회차마다 사진이 쌓이면 저장소가 금방 무거워진다. 2주 지난 것은 지운다 —
      # 발행이 끝난 회차의 배경 사진을 다시 쓸 일은 없다.
      - name: Prune old folders
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%d)
          for d in data/card-photos/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d"); day=${n%-*}
            if [[ "$day" < "$cutoff" ]]; then echo "prune $n"; rm -rf "$d"; fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/card-photos
          if git diff --cached --quiet; then
            echo "만들어진 사진이 없습니다 — 커밋할 것 없음"
          else
            git commit -m "chore: card photos ${{ github.event.inputs.date }} ${{ github.event.inputs.session }} [skip ci]"
            git push
          fi
