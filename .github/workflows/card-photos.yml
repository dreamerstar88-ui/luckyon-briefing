name: Card Background Photos

# 평일 카드(am·pm)의 배경 사진을 그날 내용에 맞게 만들어 main 에 커밋해 둔다.
#
# 왜 워크플로인가
#   사진 생성에는 GEMINI_API_KEY 가 필요한데, 이 키는 **저장소 시크릿**에 있고
#   브리핑 세션의 실행 환경에는 없다. 러너에서 만들어 커밋해 두면 세션은
#   키 없이 `git checkout origin/main -- data/card-photos` 로 받아 쓸 수 있다.
#   (data/krx-flows.json · data/futures-cache.json 과 같은 패턴)
#
# 세션이 부르는 법
#   gh workflow run card-photos.yml \
#     -f date=2026-08-24 -f session=am \
#     -f prompts='{"1":"The NYSE trading floor after the closing bell…","3":"…"}'
#   끝나면:
#     git fetch origin main -q && git checkout origin/main -- data/card-photos
#
# 실패해도 브리핑을 멈추지 않는다. 못 만든 장은 저장소에 든 예비 사진으로 내려간다.

on:
  workflow_dispatch:
    inputs:
      date:
        description: '회차 날짜 (YYYY-MM-DD)'
        required: true
      session:
        description: '세션 (am 또는 pm)'
        required: true
        default: 'am'
      prompts:
        description: '카드 번호 → 장면 설명 JSON. 예 {"1":"...","3":"..."}'
        required: true

permissions:
  contents: write

concurrency:
  group: card-photos-${{ github.event.inputs.date }}-${{ github.event.inputs.session }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARD_PHOTOS: ${{ github.event.inputs.prompts }}
        run: |
          node scripts/gen-card-photos.mjs \
            "${{ github.event.inputs.date }}" "${{ github.event.inputs.session }}"

      # 회차마다 사진이 쌓이면 저장소가 금방 무거워진다. 2주 지난 것은 지운다 —
      # 발행이 끝난 회차의 배경 사진을 다시 쓸 일은 없다.
      - name: Prune old folders
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%d)
          for d in data/card-photos/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d"); day=${n%-*}
            if [[ "$day" < "$cutoff" ]]; then echo "prune $n"; rm -rf "$d"; fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/card-photos
          if git diff --cached --quiet; then
            echo "만들어진 사진이 없습니다 — 커밋할 것 없음"
          else
            git commit -m "chore: card photos ${{ github.event.inputs.date }} ${{ github.event.inputs.session }} [skip ci]"
            git push
          fi
