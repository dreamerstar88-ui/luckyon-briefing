name: Sat Indexes

# 토요일 카드 ②③이 쓰는 지수 데이터를 data/sat-indexes.json 에 커밋해 둔다.
# 5개 지수(나스닥·S&P 500·다우·코스피·코스닥)의 일봉 70개 + 이동평균 20/50/100/200
# + 기간 고점 + RSI(14).
#
# ⚠ 이 워크플로는 **예비용이다. 1순위가 아니다.**
#
# 2026-08-08 실측으로 짐작이 뒤집혔다: 같은 스크립트가
#   · 브리핑 세션에서는 5/5 (두 번 연속 성공)
#   · Actions 러너에서는 2/5 — 미국 3개 전부 실패 (Yahoo 가 클라우드 IP 를 막는다)
# 즉 미국 지수는 **세션이 직접 받는 쪽이 낫다.** 그래서 토요일 세션은
# `node scripts/fetch-sat-indexes.mjs` 를 직접 돌리고, 이 파일은 보조로만 쓴다.
#
# 그럼 왜 남겨 두나:
#   ① 한국(FinanceDataReader 미러)은 러너에서도 확실히 잡힌다. 세션 쪽 조회가 막히는
#      날에도 코스피·코스닥은 건진다.
#   ② 소스가 깨지면 토요일 아침이 아니라 여기서 먼저 드러난다.
# **세션은 이 파일을 미국 지수의 근거로 삼지 않는다** (`missing` 을 반드시 확인할 것).

on:
  schedule:
    # 토요일 주간 결산 세션(07:35 KST) 한 시간 전. 금요일 미국장 마감(약 05:00 KST) 뒤라
    # 그 주 마지막 일봉이 확정돼 있다.
    - cron: '30 21 * * 5'   # 21:30 UTC 금 = 06:30 KST 토
  workflow_dispatch:
    inputs:
      asOf:
        description: '기준일 (YYYY-MM-DD, 비우면 오늘 KST)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sat-indexes
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch indexes
        id: fetch
        run: |
          set -o pipefail
          mkdir -p data
          if node scripts/fetch-sat-indexes.mjs ${{ inputs.asOf }} > /tmp/sat-indexes.json; then
            mv /tmp/sat-indexes.json data/sat-indexes.json
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # 지수를 하나도 못 받은 날은 기존 파일을 그대로 둔다. 여기서 실패로 끝내면
            # 낡은 데이터까지 지워져 토요일 세션이 아무것도 못 읽는다.
            echo "::warning::지수 조회 실패 — 기존 data/sat-indexes.json 을 유지합니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: steps.fetch.outputs.ok == 'true'
        run: |
          {
            echo '## 토요일 지수 데이터'
            echo
            node -e '
              const r = require("./data/sat-indexes.json");
              console.log(`기준 **${r.asOf}** · 봉 ${r.bars}개 · 지수 ${r.indexes.length}/5`);
              const us = r.missing.filter(k => ["IXIC","GSPC","DJI"].includes(k));
              if (us.length) console.log(`\n> ⚠ **미국 지수 ${us.join(", ")} 누락 — 러너에서는 정상입니다(Yahoo 가 클라우드 IP 차단).**`
                + ` 토요일 세션이 \`node scripts/fetch-sat-indexes.mjs\` 를 직접 돌려 채웁니다.`);
              const kr = r.missing.filter(k => ["KS11","KQ11"].includes(k));
              if (kr.length) console.log(`\n> 🚨 **한국 지수 ${kr.join(", ")} 누락 — 이건 비정상입니다.** 미러 소스를 확인하세요.`);
              console.log("");
              console.log("| 지수 | 종가 | 주간 | RSI | MA50 | MA200 | 고점 |");
              console.log("| --- | --- | --- | --- | --- | --- | --- |");
              for (const x of r.indexes) {
                const c = x._check || {};
                console.log(`| ${x.name_ko} | ${x.close.toLocaleString()} | ${x.wk > 0 ? "+" : ""}${x.wk}% `
                  + `| ${c.rsi14_full ?? "—"} | ${x.ma50 ?? "—"} | ${x.ma200 ?? "—"} | ${x.hiLabel_ko} ${x.hi.toLocaleString()} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: steps.fetch.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sat-indexes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh sat indexes [skip ci]"
          # 다른 캐시 워크플로가 같은 창에 main 을 밀면 push 가 거절된다(실제로 겪었다).
          # 우리가 만지는 파일은 하나뿐이라 rebase 로 얹으면 충돌 없이 붙는다.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — main 을 다시 받아 얹습니다 ($i/5)"
            sleep $((i * 3))
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::5회 시도 후에도 push 실패"
          exit 1
