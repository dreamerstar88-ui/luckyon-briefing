name: KR Trade (Exports/Imports)

# 한국 수출입(성질별)을 받아 data/kr-trade.json 에 커밋해 둔다.
#
# 왜 필요한가: fetch-kr-trade.mjs 는 한국은행 ECOS 를 쓰는데 ECOS_API_KEY 가 있어야
# 한다. 클라우드 라우틴 세션의 "환경 변수"에는 아직 전용 시크릿 저장소가 없어
# 값이 그 환경을 쓰는 누구에게나 그대로 보인다(공식 문서 경고). 이 저장소는 이미
# KRX_ID·KRX_PW 처럼 민감한 값을 세션 환경변수가 아니라 암호화된 GitHub Actions
# 시크릿으로 다룬다 — 여기도 같은 방식을 따른다.
# (data/krx-flows.json · data/econ-calendar.json · data/futures-cache.json 과 같은 패턴)
#
# 세션은 이 파일이 있으면 그대로 읽고, 없거나 낡았을 때만 ECOS_API_KEY 가 세션
# 환경변수로도 설정돼 있는 경우에 한해 스크립트를 직접 돌린다(ROUTINE_PROMPT.md 참고).

on:
  schedule:
    - cron: '10 11 * * 1-5'   # 11:10 UTC = 20:10 KST — 저녁 브리핑 직전
    - cron: '20 22 * * 0-4'   # 22:20 UTC = 07:20 KST(다음날) — 아침 브리핑 직전
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kr-trade
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch KR trade data
        id: fetch
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -o pipefail
          mkdir -p data
          if node scripts/fetch-kr-trade.mjs > /tmp/kr-trade.json; then
            mv /tmp/kr-trade.json data/kr-trade.json
            echo "ok=true" >> "$GITHUB_OUTPUT"
            cat data/kr-trade.json
          else
            # 확정치가 아직 없는 달이거나 ECOS 가 잠깐 막힌 경우다. 기존 파일을
            # 지우면 브리핑이 더 나빠지므로 그대로 둔다.
            echo "::warning::한국 수출입 조회 실패 — 기존 data/kr-trade.json 을 유지합니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.fetch.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr-trade.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh KR trade data [skip ci]"
            git push
          fi
